# frontend/nginx.conf
# ------------------------------------------------------------
# Serves the static CarbonSense site and reverse-proxies /api/
# to the backend container. Because the browser only ever talks
# to this one origin (port 80), CORS is not even needed in
# practice — Flask-CORS stays on as a safety net for anyone
# running backend/app.py directly during development.
# ------------------------------------------------------------

server {
    listen 80;
    server_name localhost;

    root  /usr/share/nginx/html;
    index index.html;

    # Static frontend (index.html / style.css / script.js)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy: /api/* -> backend:5000/api/*
    # "backend" resolves via Docker Compose's internal DNS —
    # it's the service name defined in docker-compose.yml.
    location /api/ {
        proxy_pass http://backend:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Small static-asset cache policy (nice-to-have, not required)
    location ~* \.(css|js)$ {
        expires 1h;
        add_header Cache-Control "public";
    }
}
