name: CarbonSense CI

on:
  push:
    branches: ["dev", "main"]
  pull_request:
    branches: ["dev", "main"]

permissions:
  contents: read
  packages: write

jobs:

  # ---------- 1. BACKEND: LINT + TESTS ----------
  backend-test:
    name: Backend Lint & Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Back-end

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: Back-end/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov flake8 bandit

      - name: Lint with flake8
        run: |
          flake8 . --max-line-length=120 --exclude=venv

      - name: Static security scan with Bandit
        run: |
          bandit -r . -x ./tests,./venv

      - name: Run tests with coverage
        run: |
          pytest -v --cov=. --cov-report=xml --cov-report=term

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: Back-end/coverage.xml


  # ---------- 2. FRONTEND: LINT ----------
  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Front-end

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install ESLint
        run: |
          npm install eslint --no-save

      - name: Run ESLint
        run: |
          npx eslint script.js --no-eslintrc --env browser,es2021 || true


  # ---------- 3. BUILD & PUSH DOCKER IMAGES ----------
  build-and-package:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest

    needs:
      - backend-test
      - frontend-lint

    # Only build/push Docker images when code is pushed,
    # not when a pull request is opened.
    if: github.event_name == 'push'

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Backend Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./Back-end
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/carbonsense-backend:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/carbonsense-backend:latest
        continue-on-error: true

      - name: Build & Push Frontend Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./Front-end
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/carbonsense-frontend:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/carbonsense-frontend:latest
        continue-on-error: true

      - name: Pipeline status
        if: always()
        run: |
          echo "Build status: ${{ job.status }}"