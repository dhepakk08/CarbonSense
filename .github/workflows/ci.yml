name: CarbonSense CI

# Triggers: run on every push and pull request targeting dev or main
on:
  push:
    branches: [ "dev", "main" ]
  pull_request:
    branches: [ "dev", "main" ]

jobs:

  # ---------- 1. BACKEND: LINT + UNIT/INTEGRATION TESTS ----------
  backend-test:
    name: Backend Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov flake8 bandit

      - name: Lint with flake8
        run: flake8 . --max-line-length=120 --exclude=venv

      - name: Static security scan with bandit
        run: bandit -r . -x ./tests,./venv

      - name: Run unit & integration tests with coverage
        run: pytest test_carbonsense.py -v --cov=. --cov-report=xml --cov-report=term

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: backend/coverage.xml

  # ---------- 2. FRONTEND: LINT ----------
  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install ESLint
        run: npm install eslint --no-save

      - name: Run ESLint on script.js
        run: npx eslint script.js --no-eslintrc --env browser,es2021 || true

  # ---------- 3. CODE QUALITY GATE (SonarCloud) ----------
  code-quality:
    name: SonarCloud Quality Gate
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-lint]
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: backend-coverage-report
          path: backend/

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # ---------- 4. BUILD & PACKAGE DOCKER IMAGES ----------
  build-and-package:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: [code-quality]
    if: github.event_name == 'push'
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/carbonsense-backend:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/carbonsense-backend:latest

      - name: Build & push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/carbonsense-frontend:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/carbonsense-frontend:latest

      - name: Notify pipeline status
        if: always()
        run: echo "Build status - ${{ job.status }}. Add Slack/Email webhook step here."