name: CarbonSense CD

on:
  workflow_run:
    workflows: ["CarbonSense CI"]
    types: [completed]

jobs:
  deploy-local:
    name: Deploy CarbonSense Locally
    runs-on: self-hosted

    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Stop existing containers
        run: docker compose down
        shell: powershell

      - name: Build and start CarbonSense
        run: docker compose up -d --build
        shell: powershell

      - name: Show running containers
        run: docker compose ps
        shell: powershell

      - name: Health check
        run: |
          Write-Host "Waiting for services to start..."
          $maxRetries = 15
          $retryCount = 0
          $healthUrl = "http://localhost:5000/api/health"
          
          do {
            $retryCount++
            Write-Host "Health check attempt $retryCount/$maxRetries..."
            try {
              $response = Invoke-WebRequest -Uri $healthUrl -Method Get -UseBasicParsing -TimeoutSec 5 -ErrorAction Stop
              if ($response.StatusCode -eq 200) {
                Write-Host "✓ Health check passed!"
                exit 0
              }
            } catch {
              Write-Host "Attempt $retryCount failed: $($_.Exception.Message)"
              if ($retryCount -lt $maxRetries) {
                Start-Sleep -Seconds 2
              }
            }
          } while ($retryCount -lt $maxRetries)
          
          Write-Host "✗ Health check failed after $maxRetries attempts"
          exit 1
        shell: powershell